<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Timezone Digital Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 900px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .clocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .clock-card {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .clock-card:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-5px);
    }

    .timezone-name {
      color: #fff;
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 12px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    .timezone-code {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9em;
      margin-bottom: 15px;
    }

    .digital-time {
      font-size: 2.5em;
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #00ff88, 0 0 20px rgba(0, 255, 136, 0.5);
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
    }

    .date-time {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9em;
      line-height: 1.5;
    }

    .status {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85em;
    }

    .status.day {
      color: #ffeb3b;
    }

    .status.night {
      color: #87ceeb;
    }

    .controls {
      margin-top: 30px;
      text-align: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      margin: 0 5px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 1.8em;
      }

      .clocks-grid {
        grid-template-columns: 1fr;
      }

      .digital-time {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⏰ Global Time Zones</h1>
      <p>Real-time clock in multiple time zones</p>
    </div>

    <div class="clocks-grid" id="clocks-grid"></div>

    <div class="controls">
      <button class="btn" onclick="addTimezone()">+ Add Timezone</button>
      <button class="btn" onclick="resetToDefault()">Reset</button>
    </div>
  </div>

  <script>
    const defaultTimezones = [
      { name: 'New York', tz: 'America/New_York' },
      { name: 'London', tz: 'Europe/London' },
      { name: 'Tokyo', tz: 'Asia/Tokyo' },
      { name: 'Sydney', tz: 'Australia/Sydney' },
      { name: 'Dubai', tz: 'Asia/Dubai' },
      { name: 'Bangkok', tz: 'Asia/Bangkok' }
    ];

    const allTimezones = [
      { name: 'New York', tz: 'America/New_York' },
      { name: 'Los Angeles', tz: 'America/Los_Angeles' },
      { name: 'Chicago', tz: 'America/Chicago' },
      { name: 'Denver', tz: 'America/Denver' },
      { name: 'London', tz: 'Europe/London' },
      { name: 'Paris', tz: 'Europe/Paris' },
      { name: 'Berlin', tz: 'Europe/Berlin' },
      { name: 'Dubai', tz: 'Asia/Dubai' },
      { name: 'Bangkok', tz: 'Asia/Bangkok' },
      { name: 'Singapore', tz: 'Asia/Singapore' },
      { name: 'Tokyo', tz: 'Asia/Tokyo' },
      { name: 'Sydney', tz: 'Australia/Sydney' },
      { name: 'Auckland', tz: 'Pacific/Auckland' },
      { name: 'Moscow', tz: 'Europe/Moscow' },
      { name: 'Istanbul', tz: 'Europe/Istanbul' },
      { name: 'Hong Kong', tz: 'Asia/Hong_Kong' }
    ];

    let currentTimezones = [...defaultTimezones];

    function formatTime(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }

    function formatDate(date) {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    function getTimeStatus(hours) {
      if (hours >= 6 && hours < 18) {
        return { status: '🌞 Day', class: 'day' };
      } else {
        return { status: '🌙 Night', class: 'night' };
      }
    }

    function createClockCard(timezone) {
      const date = new Date().toLocaleString('en-US', { timeZone: timezone.tz });
      const localDate = new Date(date);
      
      const hours = localDate.getHours();
      const { status, class: statusClass } = getTimeStatus(hours);

      return `
        <div class="clock-card">
          <div class="timezone-name">${timezone.name}</div>
          <div class="timezone-code">${timezone.tz}</div>
          <div class="digital-time">${formatTime(localDate)}</div>
          <div class="date-time">${formatDate(localDate)}</div>
          <div class="status ${statusClass}">${status}</div>
        </div>
      `;
    }

    function updateClocks() {
      const grid = document.getElementById('clocks-grid');
      grid.innerHTML = currentTimezones.map(tz => createClockCard(tz)).join('');
    }

    function addTimezone() {
      const unusedTimezones = allTimezones.filter(
        tz => !currentTimezones.some(ct => ct.tz === tz.tz)
      );

      if (unusedTimezones.length === 0) {
        alert('All timezones are already added!');
        return;
      }

      const randomTz = unusedTimezones[Math.floor(Math.random() * unusedTimezones.length)];
      currentTimezones.push(randomTz);
      updateClocks();
    }

    function resetToDefault() {
      currentTimezones = [...defaultTimezones];
      updateClocks();
    }

    // Initial render
    updateClocks();

    // Update every second
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
